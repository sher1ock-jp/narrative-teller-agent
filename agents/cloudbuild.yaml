# cloudbuild.yaml
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: manga-agent-repo

steps:
  # 1) Docker イメージをビルド＋タグ付け
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'OPENAI_API_KEY=${{secrets.OPENAI_API_KEY}}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/narrative-teller-agent'
      - '.'
    env:
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
      - 'GOOGLE_CLOUD_REGION=${_REGION}'

  # 2) Artifact Registry へプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/narrative-teller-agent'

images:
  - 'gcr.io/$PROJECT_ID/narrative-teller-agent'