name: Build & Deploy

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # GCP 認証（必要に応じて）
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Docker イメージビルド（ビルド引数でキーを渡す）
      - name: Build Docker
        run: |
          docker build \
            --build-arg OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -t gcr.io/$GCP_PROJECT/manga-agent .

      # コンテナレジストリにプッシュ
      - name: Push to GCR
        run: docker push gcr.io/$GCP_PROJECT/manga-agent

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Cloud Run へデプロイ（実行時環境変数としてキーを設定）
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy manga-agent \
            --image gcr.io/$GCP_PROJECT/manga-agent \
            --region=asia-northeast1 \
            --set-env-vars OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --platform=managed \
            --quiet
